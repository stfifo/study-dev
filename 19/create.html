<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web Programming</title>
	<link rel="stylesheet" href="css/subject.css">
</head>
<body>
  <div class="container">
    <h1>Web Programming</h1>
    <p>공부할 주제를 기록해 보세요</p>
    <form action="">
      <label for="subject" class="hidden">주제</label>
      <input type="text" id="subject" autofocus>
      <button>추가</button>
    </form>
    <hr>  
    <ul id="itemList"></ul>  
  </div>

  <script>
    const li_parent = document.querySelector("#itemList");
    function register() {
      let newItem = document.createElement("li");
      let subject = document.querySelector("#subject");
      let inputText = document.createTextNode(subject.value);

      newItem.appendChild(inputText);

      li_parent.appendChild(newItem);

      subject.value = "";
    }

    document.addEventListener("DOMContentLoaded", function() {
      const button = document.querySelector("button");
      button.addEventListener("click", function(event) {
        event.preventDefault();
        register();
      });
    });

    li_parent.addEventListener("click", (event) => {
      if (event.target.tagName === "LI") {
        if (confirm("삭제하시겠습니까?")) {
          event.target.remove();
        }
      }
    });
  </script>
</body>
</html>
