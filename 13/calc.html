<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 함수</title>
  <style>
  :root {
    --bg-yellow: #fcc100;
    --bg-gray: #9b9b9b;
  }

    * {
      margin:0;
      padding:0;
      box-sizing: border-box;
    }

    /* Do it! calc() 함수로 너비 지정하기 */
    #h11 {
      background-color: var(--bg-yellow);
      color: #fff;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      text-shadow: 2px 2px 2px #000;    
      width: calc(100% - 80px);
    }

    #h22 {
      background-color: var(--bg-gray);
      color: #fff;
      padding: 10px;
      margin-top: 2em;
      text-align: center;
      font-weight: bold;
      text-shadow: 2px 2px 2px #000;    
      width: calc(100% - -80px);
    }
  </style>
</head>
<body>
  <div class="heading">
    <h1 id="h11">CSS 함수</h1>
    <h1 id="h22">CSS 함수2</h1>
  </div>
</body>
</html>
